        <div id="toolEncryption" class="page-section">
            <div class="page-hero">
                <div class="page-hero-icon-row">
                    <div class="page-hero-icon-wrap"><i class="fas fa-lock"></i></div>
                    <div><div class="page-hero-title">Encryption Tools</div><div class="page-hero-sub">Client-side encryption &amp; hashing tools</div></div>
                </div>
            </div>
            <div class="input-section">
                <div class="input-label"><i class="fas fa-layer-group"></i> Select Method</div>
                <div class="category-chips" style="margin:0 0 16px 0;">
                    <div class="chip active" data-method="base64enc" onclick="selectEncMethod(this)">Base64 Encode</div>
                    <div class="chip" data-method="base64dec" onclick="selectEncMethod(this)">Base64 Decode</div>
                    <div class="chip" data-method="md5" onclick="selectEncMethod(this)">MD5</div>
                    <div class="chip" data-method="sha256" onclick="selectEncMethod(this)">SHA256</div>
                    <div class="chip" data-method="sha512" onclick="selectEncMethod(this)">SHA512</div>
                    <div class="chip" data-method="rot13" onclick="selectEncMethod(this)">ROT13</div>
                </div>
                <div class="input-group" style="flex-direction:column;gap:10px;">
                    <textarea id="encInput" class="input-field" placeholder="Enter text to encrypt/hash..." style="min-height:100px;resize:vertical;"></textarea>
                    <button class="submit-btn" onclick="processEncryption()" style="width:100%;"><i class="fas fa-bolt"></i> Process</button>
                </div>
            </div>
            <div class="result-card-inner" id="encResult">
                <div class="result-header">
                    <div class="result-title"><i class="fas fa-file-code"></i> Output</div>
                    <div class="result-meta"><button class="copy-btn" onclick="copyEncOutput()"><i class="fas fa-copy"></i> Copy</button></div>
                </div>
                <div class="code-container"><div class="code-content" id="encOutput"></div></div>
            </div>
        </div>
